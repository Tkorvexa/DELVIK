<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You | DELVIK Build</title>
    <meta name="description" content="Thank you for contacting DELVIK Build.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#111111">
    <link rel="stylesheet" href="/style.css?v=20260802-1">
    <link rel="icon" type="image/png" sizes="64x64" href="logos/favicon-delvik.svg">
</head>
<body class="page-contact-build">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
        <div class="nav">
            <a class="brand" href="/" aria-label="DELVIK Build home">
                <img src="logos/delvik-logo-horizontal.svg" alt="DELVIK Build" class="brand__logo" width="180" height="46" decoding="async">
            </a>
            <button class="nav__hamburger" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navMenu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="navMenu" aria-label="Primary">
                <a href="/#services">Services</a>
                <a href="/#projects">Projects</a>
                <a href="/areas-served">Areas</a>
                <a href="/#process">Process</a>
                <a href="/contact-build">Contact</a>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="section section--center thank-you">
            <div class="container">
                <p class="eyebrow">Message received</p>
                <h1 class="section__title">Thank you for contacting DELVIK Build.</h1>
                <p class="section__lead">Your enquiry has been submitted. We will review the project details and respond with the next steps.</p>
                <p><a class="btn btn--dark" href="/">Return to the homepage</a></p>
            </div>
        </section>
    </main>

    <footer class="site-footer" aria-label="Legal information">
        <div class="footer-bar">
            <div class="footer-bar__inner">
                <div class="footer-bar__left">Copyright &copy; <span id="y"></span> DELVIK Group Limited. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById("y").textContent = new Date().getFullYear();
        const toggle = document.getElementById("navToggle");
        const menu = document.getElementById("navMenu");

        toggle.addEventListener("click", function () {
            const open = menu.classList.toggle("nav--open");
            toggle.classList.toggle("nav__hamburger--open", open);
            toggle.setAttribute("aria-expanded", String(open));
        });

        menu.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
                menu.classList.remove("nav--open");
                toggle.classList.remove("nav__hamburger--open");
                toggle.setAttribute("aria-expanded", "false");
            });
        });

    </script>
    <script src="/site.js?v=20260802-1"></script>
    <script>if (window.korvexaTrack) window.korvexaTrack("generate_lead", { form_name: "project_enquiry" });</script>
</body>
</html>
